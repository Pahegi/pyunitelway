[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "pyunitelway"
version = "0.1.0"
description = "Implementation of transport layer unitelway client and multiple application layer UNITE requests."
authors = ["paul.hermann <paul.hermann@makerspace-darmstadt.de>"]
readme = "README.md"
packages = [{ include = "pyunitelway" }, { include = "example" }]

[tool.poetry.dependencies]
python = "~3.12"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"

[tool.poetry.scripts]
test = "example.test:main"
listen = "example.listen:main"
panel = "example.panel:main"
backup = "example.backup:main"